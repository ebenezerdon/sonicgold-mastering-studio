<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio | SonicGold</title>
    <script src="https://cdn.jsdelivr.net/npm/tailwindcss-cdn@3.4.10/tailwindcss.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles/main.css">
    
    <style type="text/tailwindcss" data-teda="tailwind-apply">
        @layer components {
            .btn-control { @apply w-12 h-12 rounded-full flex items-center justify-center text-slate-400 hover:text-white hover:bg-white/10 transition-all; }
            .preset-btn { @apply flex flex-col items-center justify-center gap-2 p-4 rounded-xl border border-white/5 hover:bg-slate-700 transition-all cursor-pointer bg-slate-800; }
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden bg-slate-900 text-white flex flex-col">

    <!-- Top Bar -->
    <header class="h-16 border-b border-white/10 flex items-center justify-between px-6 bg-slate-950">
        <div class="flex items-center gap-6">
            <a href="index.html" class="hover:opacity-80 transition-opacity">
                <img src="assets/logo.svg" alt="SonicGold" class="h-6">
            </a>
            <div class="h-6 w-px bg-white/10"></div>
            <span id="fileName" class="font-mono text-sm text-amber-500 truncate max-w-[200px]">No Track Loaded</span>
        </div>
        
        <div class="flex items-center gap-4">
            <button id="exportBtn" class="bg-amber-500 text-black px-6 py-2 rounded-lg font-bold hover:bg-amber-400 hover:shadow-gold transition-all flex items-center gap-2">
                <i class="fas fa-download"></i> Export Master
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 relative flex flex-col">
        
        <!-- Upload/Empty State overlay -->
        <div id="uploadState" class="absolute inset-0 z-20 flex flex-col items-center justify-center bg-slate-900/90 backdrop-blur-sm">
            <div id="dropZone" class="w-full max-w-2xl border-2 border-dashed border-slate-700 rounded-3xl p-12 text-center transition-all cursor-pointer hover:border-amber-500/50 hover:bg-slate-800/50 group">
                <div class="w-20 h-20 bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-6 group-hover:scale-110 transition-transform shadow-lg">
                    <i class="fas fa-cloud-upload-alt text-3xl text-slate-400 group-hover:text-amber-500"></i>
                </div>
                <h2 class="text-3xl font-bold mb-2">Drop your mix here</h2>
                <p class="text-slate-400 mb-8">Supports WAV, MP3, AIFF (Max 100MB)</p>
                <button class="px-8 py-3 bg-slate-700 hover:bg-slate-600 rounded-full font-medium transition-colors">Select File</button>
                <input type="file" id="fileInput" class="hidden" accept="audio/*">
            </div>
        </div>

        <!-- Loading State -->
        <div id="loadingState" class="absolute inset-0 z-30 hidden flex-col items-center justify-center bg-slate-900">
            <div class="audio-loader mb-6"></div>
            <h3 class="text-xl font-bold animate-pulse">Analyzing Audio...</h3>
        </div>

        <!-- The Studio (Hidden initially) -->
        <div id="mainInterface" class="flex-1 flex flex-col hidden h-full">
            
            <!-- Visualization Area -->
            <div class="flex-1 relative bg-slate-900 flex items-center justify-center p-8">
                <div class="w-full h-full relative rounded-2xl overflow-hidden glass-panel shadow-2xl">
                    <canvas id="waveformCanvas" class="w-full h-full cursor-crosshair"></canvas>
                    
                    <!-- Transport Overlay (Center) -->
                    <div class="absolute bottom-8 left-1/2 -translate-x-1/2 flex items-center gap-6 px-8 py-3 bg-slate-950/80 backdrop-blur-md rounded-full border border-white/10 shadow-xl z-10">
                         <button class="btn-control" title="Rewind" onclick="App.DSP.seek(0)"><i class="fas fa-backward"></i></button>
                         <button id="playBtn" class="w-14 h-14 bg-amber-500 text-black rounded-full flex items-center justify-center text-xl hover:scale-105 transition-transform shadow-gold">
                             <i class="fas fa-play ml-1"></i>
                         </button>
                         <div class="text-xs font-mono text-slate-400 w-24 text-center">
                             <span id="currentTime">0:00</span> / <span id="totalTime">0:00</span>
                         </div>
                    </div>
                </div>
            </div>

            <!-- Controls Deck -->
            <div class="h-64 bg-slate-950 border-t border-white/10 p-6 flex gap-6 overflow-x-auto">
                
                <!-- Section: Presets -->
                <div class="flex-1 min-w-[300px]">
                    <h4 class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4">Mastering Style</h4>
                    <div class="grid grid-cols-4 gap-4">
                        <div class="preset-btn ring-2 ring-amber-500 bg-slate-700" data-preset="universal">
                            <i class="fas fa-globe text-amber-500"></i>
                            <span class="text-xs font-bold">Universal</span>
                        </div>
                        <div class="preset-btn" data-preset="fire">
                            <i class="fas fa-fire text-red-500"></i>
                            <span class="text-xs font-bold">Fire</span>
                        </div>
                        <div class="preset-btn" data-preset="clarity">
                            <i class="fas fa-bolt text-cyan-400"></i>
                            <span class="text-xs font-bold">Clarity</span>
                        </div>
                        <div class="preset-btn" data-preset="retro">
                            <i class="fas fa-cassette-tape text-orange-300"></i>
                            <span class="text-xs font-bold">Retro</span>
                        </div>
                    </div>
                </div>

                <div class="w-px bg-white/10"></div>

                <!-- Section: Intensity & A/B -->
                <div class="w-1/3 min-w-[300px] flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between mb-2">
                             <h4 class="text-xs font-bold text-slate-500 uppercase tracking-widest">Intensity</h4>
                             <span class="text-xs text-amber-500 font-mono">80%</span>
                        </div>
                        <input type="range" id="intensityRange" min="0" max="1" step="0.01" value="0.8" class="w-full">
                    </div>

                    <div class="flex items-center justify-between bg-slate-900 rounded-xl p-4 border border-white/5">
                        <span class="text-sm text-slate-400 font-medium">Compare Result</span>
                        <button id="compareToggle" class="relative group">
                            <div id="compareBtnVisual" class="px-6 py-2 bg-slate-700 text-white rounded-lg text-xs font-bold tracking-wider transition-colors select-none">
                                MASTERED
                            </div>
                            <div class="absolute -top-10 left-1/2 -translate-x-1/2 bg-black text-white text-[10px] px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">
                                Hold to hear original
                            </div>
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="scripts/helpers.js"></script>
    <script src="scripts/dsp.js"></script>
    <script src="scripts/ui.js"></script>
    <script src="scripts/main.js"></script>
</body>
</html>
